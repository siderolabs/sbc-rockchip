---
kind: pkgfile.Build
spec:
  targets:
    - sbc-rockchip
  extraBuildArgs:
    - PKGS_PREFIX
    - PKGS
    - TOOLS_PREFIX
    - TOOLS
  makefile:
    extraVariables:
      - name: PKGS_PREFIX
        defaultValue: ghcr.io/siderolabs
      - name: PKGS
        defaultValue: v1.15.0-alpha.0-67-gff868eb
      - name: TOOLS_PREFIX
        defaultValue: ghcr.io/siderolabs
      - name: TOOLS
        defaultValue: v1.15.0-alpha.0-16-g54f72f9
---
kind: common.Build
spec:
  ignoredPaths:
    - go.work.sum
---
kind: common.Renovate
spec:
  packageRules:
    - matchPackageNames:
        - ARM-software/arm-trusted-firmware
      versioning: 'regex:^((?<compatibility>\S+)-)?v(?<major>\d+)\.(?<minor>\d+)\.?(?<patch>\d+)?$'
    - matchPackageNames:
        - u-boot/u-boot
      versioning: 'regex:^(?<major>\d+)\.(?<minor>\d+)(?<prerelease>-rc\d+)?$'
