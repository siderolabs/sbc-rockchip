# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-rock4se
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-rk3399
  - stage: rkbin-rk3399
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # rock-4se-rk3399
      - |
        tar xf u-boot.tar.gz --strip-components=1
      - |
        make rock-4se-rk3399_defconfig
        # Host tools: image signing needs the OpenSSL ENGINE API (removed in the toolchain's OpenSSL),
        # and mkeficapsule needs gnutls with PKCS#11 support; neither is used for the Rockchip boot images.
        ./scripts/config --disable TOOLS_LIBCRYPTO --disable TOOLS_KWBIMAGE --disable TOOLS_MKEFICAPSULE \
          --enable ROCKCHIP_EXTERNAL_TPL
        make olddefconfig
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31=/libs/arm-trusted-firmware/rk3399/bl31.elf ROCKCHIP_TPL=/libs/rkbin/rk3399_ddr_800MHz_v1.30.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/rock4se
        cp u-boot-rockchip.bin /rootfs/artifacts/arm64/u-boot/rock4se
finalize:
  - from: /rootfs
    to: /rootfs
