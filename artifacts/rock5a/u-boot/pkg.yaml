# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-rock5a
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-rk3588
  - stage: rkbin-rk3588
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # rock-5a-rk3588s
      - |

        tar xf u-boot.tar.gz --strip-components=1
      - |
        make rock5a-rk3588s_defconfig
        # Host tools: image signing needs the OpenSSL ENGINE API (removed in the toolchain's OpenSSL),
        # and mkeficapsule needs gnutls with PKCS#11 support; neither is used for the Rockchip boot images.
        ./scripts/config --disable TOOLS_LIBCRYPTO --disable TOOLS_KWBIMAGE --disable TOOLS_MKEFICAPSULE
        make olddefconfig
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31=/libs/arm-trusted-firmware/rk3588/bl31.elf ROCKCHIP_TPL=/libs/rkbin/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.19.bin
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/rock5a
        cp u-boot-rockchip.bin /rootfs/artifacts/arm64/u-boot/rock5a
finalize:
  - from: /rootfs
    to: /rootfs
