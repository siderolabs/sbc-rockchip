# References:
#   U-Boot:
#     - https://u-boot.readthedocs.io/en/latest
name: u-boot-orangepi-r1-plus-lts
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: arm-trusted-firmware-rk3328
steps:
  - sources:
      - url: https://github.com/u-boot/u-boot/archive/refs/tags/v{{ .uboot_version }}.tar.gz
        destination: u-boot.tar.gz
        sha256: "{{ .uboot_sha256 }}"
        sha512: "{{ .uboot_sha512 }}"
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      # orangepi-r1-plus-lts-rk3328
      - |
        tar xf u-boot.tar.gz --strip-components=1
      - |
        make orangepi-r1-plus-lts-rk3328_defconfig
        # Host tools: image signing needs the OpenSSL ENGINE API (removed in the toolchain's OpenSSL),
        # and mkeficapsule needs gnutls with PKCS#11 support; neither is used for the Rockchip boot images.
        ./scripts/config --disable TOOLS_LIBCRYPTO --disable TOOLS_KWBIMAGE --disable TOOLS_MKEFICAPSULE
        make olddefconfig
    build:
      - |
        make -j $(nproc) HOSTLDLIBS_mkimage="-lssl -lcrypto" BL31=/libs/arm-trusted-firmware/rk3328/bl31.elf \
          CONFIG_USB_HOST_ETHER=y \
          CONFIG_USB_ETHER_RTL8152=y
    install:
      - |
        mkdir -p /rootfs/artifacts/arm64/u-boot/orangepi-r1-plus-lts
        cp u-boot-rockchip.bin /rootfs/artifacts/arm64/u-boot/orangepi-r1-plus-lts
finalize:
  - from: /rootfs
    to: /rootfs
